[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casci2molden"
version = "0.1.0"
description = "Convert PySCF CASCI.log files (with .xyz and RHF/ROHF.log) into Molden files for EigenVista."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Ugo Varetto" }]
keywords = ["quantum-chemistry", "molden", "pyscf", "casci", "eigenvista", "natural-orbitals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.23",
    "pyscf>=2.1",
]

[project.urls]
Homepage = "https://github.com/uvar-apps/casci2molden"
Repository = "https://github.com/uvar-apps/casci2molden"
Issues = "https://github.com/uvar-apps/casci2molden/issues"

[project.scripts]
casci2molden = "casci2molden.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
